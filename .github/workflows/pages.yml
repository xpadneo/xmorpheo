#
# Builds the website with "make site" and deploys it to GitHub Pages for a
# release. The landing page and the build come from the default branch, the
# documentation from the release tag, see site/AGENTS.md. Pull requests
# that touch the website only build it, from their own documentation.

name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to document, empty for the latest v* tag
        required: false
        type: string
  pull_request:
    paths:
      - site/**
      - docs/**
      - examples/**
      - CHANGELOG.md
      - Makefile
      - .github/workflows/pages.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A release checks out its tag, but the website comes from the
          # default branch. The history brings the tags.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          fetch-depth: 0

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=$(python3 site/build.py --mdbook-version)
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            release) tag="$RELEASE_TAG" ;;
            pull_request) tag=HEAD ;;
            *) tag="$INPUT_TAG" ;;
          esac
          make site TAG="$tag"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
